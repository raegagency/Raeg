<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAEG | رائج</title>
<meta name="description" content="RAEG is a creative digital agency for websites, social media and company profiles.">
<meta property="og:title" content="RAEG | رائج"><meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--w:#fff;--p:#8B3DF5;--dp:#4B1FA8;--lav:#F3ECFF;--bl:#3F8CFF;--y:#FFDC5A;--pk:#FFA9B8;--g:linear-gradient(135deg,#C32DE7,#8B3DF5 55%,#3F8CFF);--tx:#191622;--tx2:#706B7C;--bg:#fff;--card:#fff;--ln:#e4dcfb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14101f;--card:#1d1830;--lav:#221b3a;--tx:#f4f1fb;--tx2:#b0a9c2;--ln:#35295a}}
:root[data-theme="dark"]{--bg:#14101f;--card:#1d1830;--lav:#221b3a;--tx:#f4f1fb;--tx2:#b0a9c2;--ln:#35295a}
*,*::before,*::after{box-sizing:inherit}html{scroll-behavior:smooth;scroll-padding-top:calc(80px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
[dir=rtl] body,[dir=rtl] input,[dir=rtl] select,[dir=rtl] textarea,[dir=rtl] button{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif}
a{color:inherit;text-decoration:none}img{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid var(--ln)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.nav{display:flex;align-items:center;gap:18px;height:68px}
.logo{font-weight:800;font-size:1.5rem;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.logo img{display:block;height:44px;width:auto}.logo i{width:14px;height:14px;background:var(--p);border-radius:50% 50% 50% 0;display:inline-block}.logo small{font-weight:600;color:var(--p);font-size:1.05rem}
.links{display:flex;gap:6px;margin-inline-start:auto;align-items:center}
.links a{padding:8px 12px;border-radius:99px;font-weight:600;font-size:.92rem}.links a:hover,.links a.on{background:var(--lav);color:var(--p)}
.btn{display:inline-block;border:2px solid var(--p);background:var(--g);color:#fff;padding:12px 24px;border-radius:99px;font-weight:700;cursor:pointer;font-size:1rem;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:4px 4px 0 var(--y)}.btn.o{background:transparent!important;color:var(--p)}.btn.w{background:#fff;color:var(--dp);border-color:#fff}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.lang{background:none;border:2px solid var(--ln);border-radius:99px;padding:6px 12px;font-weight:700;cursor:pointer;color:var(--tx)}
.burger{display:none;background:none;border:0;font-size:1.7rem;cursor:pointer;color:var(--tx)}
:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
h1{font-size:clamp(2.4rem,7vw,5.2rem);line-height:1.02;letter-spacing:-.03em;margin:0 0 20px;font-weight:800}[dir=rtl] h1{line-height:1.25;letter-spacing:0}
h2{font-size:clamp(1.8rem,4.5vw,3.2rem);line-height:1.1;margin:0 0 16px;letter-spacing:-.02em}[dir=rtl] h2{line-height:1.35;letter-spacing:0}
h1 em,h2 em{font-style:normal;color:var(--p)}
.sec{padding:80px 0}.lav{background:color-mix(in srgb,var(--lav) 72%,transparent)}
.bgm{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgm i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;background:radial-gradient(circle,rgba(139,61,245,.22),rgba(139,61,245,0) 68%);animation:dr 22s ease-in-out infinite alternate}
.bgm i:nth-child(1){top:-20vmax;inset-inline-start:-15vmax}.bgm i:nth-child(2){bottom:-25vmax;inset-inline-end:-15vmax;animation-duration:28s;animation-delay:-8s;background:radial-gradient(circle,rgba(75,31,168,.2),rgba(75,31,168,0) 68%)}.bgm i:nth-child(3){top:30%;inset-inline-start:35%;width:40vmax;height:40vmax;animation-duration:34s;animation-delay:-14s;background:radial-gradient(circle,rgba(63,140,255,.12),rgba(63,140,255,0) 68%)}
@keyframes dr{0%{transform:translate(0,0) scale(1)}50%{transform:translate(12vmax,8vmax) scale(1.15)}100%{transform:translate(-8vmax,14vmax) scale(.95)}}.sub{color:var(--tx2);font-size:1.1rem;max-width:56ch}
.tag{display:inline-block;background:var(--y);color:#191622;font-weight:700;font-size:.78rem;padding:4px 12px;border-radius:99px;margin-bottom:16px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding:70px 0}
.stage{position:relative;height:430px}
.bw{position:absolute;background:var(--card);border:2px solid var(--tx);border-radius:14px;box-shadow:8px 8px 0 var(--p);overflow:hidden}
.bw .bar{height:26px;background:var(--lav);display:flex;gap:5px;align-items:center;padding:0 10px}.bar b{width:8px;height:8px;border-radius:50%;background:var(--pk)}
.b1{width:72%;height:62%;top:0;inset-inline-start:0;animation:fl 6s ease-in-out infinite}.b2{width:36%;height:40%;bottom:0;inset-inline-end:4%;box-shadow:6px 6px 0 var(--pk);animation:fl 7s ease-in-out -2s infinite}
.b3{width:42%;height:34%;bottom:4%;inset-inline-start:6%;box-shadow:6px 6px 0 var(--bl);animation:fl 8s ease-in-out -4s infinite}
.sh{position:absolute;border-radius:50%;background:var(--p)}.chip{position:absolute;background:var(--dp);color:#fff;font-weight:700;font-size:.78rem;padding:6px 14px;border-radius:99px;z-index:2}
.ln{height:10px;border-radius:5px;background:var(--lav);margin:8px 12px}.blk{background:var(--g);margin:12px;border-radius:10px;height:70px}
@keyframes fl{50%{transform:translateY(-12px)}}
.statement{background:linear-gradient(135deg,var(--dp),#8B3DF5 70%,#C32DE7);color:#fff;border-radius:28px;padding:clamp(28px,6vw,70px);position:relative;overflow:hidden}
.statement h2{font-size:clamp(2rem,6vw,4.4rem)}.statement p{max-width:60ch;color:#e6dcff}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:var(--card);border:2px solid var(--tx);border-radius:20px;padding:26px;transition:transform .25s,box-shadow .25s;display:block}
.card:hover{transform:translate(-4px,-4px);box-shadow:8px 8px 0 var(--p)}
.num{font-weight:800;font-size:3rem;color:var(--p);line-height:1}.card ul,.lst{padding-inline-start:20px;color:var(--tx2);margin:12px 0}
.vis{height:130px;border-radius:12px;margin-bottom:16px;position:relative;overflow:hidden;background:var(--lav)}
.pj{display:grid;grid-template-columns:repeat(6,1fr);gap:20px}.pj>a:nth-child(1){grid-column:span 4}.pj>a:nth-child(2){grid-column:span 2}.pj>a:nth-child(3){grid-column:span 2}.pj>a:nth-child(4){grid-column:span 4}.pj>a:nth-child(5){grid-column:span 6}
.pj .vis{height:210px}.pj>a:nth-child(odd) .vis{height:260px}
.proc{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;counter-reset:s}
.step{border-top:4px solid var(--p);padding-top:16px}.step .num{font-size:2.2rem}
.cta{background:linear-gradient(135deg,var(--dp),#8B3DF5 70%,#C32DE7);color:#fff;padding:90px 0;text-align:center;position:relative;overflow:hidden}.cta .sub{color:#e6dcff;margin:0 auto 28px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.chips button{border:2px solid var(--p);background:none;color:var(--p);padding:8px 18px;border-radius:99px;font-weight:700;cursor:pointer}.chips button.on{background:var(--g);color:#fff}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}.field label{font-weight:700;font-size:.92rem}
input,select,textarea{padding:12px 14px;border:2px solid var(--ln);border-radius:12px;font-size:1rem;background:var(--card);color:var(--tx);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--p);outline:none}.err{color:#c62828;font-size:.85rem;min-height:1em}
.msg{padding:14px;border-radius:12px;margin-top:14px;font-weight:600}.msg.bad{background:#fde8e8;color:#8a1c1c}.msg.ok{background:#e6f7ec;color:#14532d}
details{border-bottom:1px solid var(--ln);padding:12px 0}summary{cursor:pointer;font-weight:700}details p{color:var(--tx2);margin:8px 0 0}
footer{background:var(--lav);padding:50px 0 30px;margin-top:0}.fg{display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px}footer a{display:block;color:var(--tx2);padding:3px 0}footer a:hover{color:var(--p)}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
.bgm i:nth-child(1){background:radial-gradient(circle,rgba(139,61,245,.5),rgba(139,61,245,0) 66%);width:75vmax;height:75vmax}.bgm i:nth-child(2){background:radial-gradient(circle,rgba(75,31,168,.42),rgba(75,31,168,0) 66%);width:70vmax;height:70vmax}.bgm i:nth-child(3){background:radial-gradient(circle,rgba(255,184,210,.45),rgba(255,184,210,0) 66%)}
.bgm b{position:absolute;display:block;animation:fy 9s ease-in-out infinite alternate}
.bgm .r{border:3px solid rgba(139,61,245,.5);border-radius:50%}.bgm .q{border:3px solid rgba(75,31,168,.45);border-radius:16px;animation-name:sp;animation-duration:14s}.bgm .d{background:rgba(139,61,245,.4);border-radius:50%}
@keyframes fy{to{transform:translate(18px,-44px)}}@keyframes sp{to{transform:rotate(200deg) translateY(-34px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}.rv{opacity:1;transform:none}}
@media (max-width:860px){.hero,.grid3,.grid2,.proc,.fg{grid-template-columns:1fr}.pj{grid-template-columns:1fr}.pj>a{grid-column:auto!important}.stage{height:360px}.sec{padding:56px 0}
.burger{display:block;margin-inline-start:auto}.links{position:fixed;inset:calc(68px + env(safe-area-inset-top,0px)) 0 auto 0;background:var(--bg);flex-direction:column;align-items:stretch;padding:16px 20px 24px;border-bottom:1px solid var(--ln);transform:translateY(-12px);opacity:0;visibility:hidden;transition:.25s;margin:0}
.links.open{transform:none;opacity:1;visibility:visible}.nav>.hd{display:none}}

if(m){const p=PJ.find(x=>x.id==m[1]);if(p){k="/work";html=`<div class="wrap sec"><a href="#/work" style="color:var(--p);font-weight:700">${L("← All projects","→ كل المشاريع")}</a><br><br><span class="tag">${p.real?L("Client Project","مشروع عميل"):L("Concept Project","تصميم تصوري")}</span><h1>${L(...p.t)}</h1><p class="sub">${L(...p.d)}</p>${mock(p.col)}${p.real?realBox(p):""}<div class="grid2" style="${p.real?"display:none":""}"><div class="card"><h3>${L("Objectives","الأهداف")}</h3><p style="color:var(--tx2)">${L("Show a clear, memorable way to present this type of business.","توضيح طريقة واضحة ولا تُنسى لتقديم هذا النوع من الأعمال.")}</p></div><div class="card"><h3>${L("Scope of work","نطاق العمل")}</h3><p style="color:var(--tx2)">${L(...p.cat)}</p></div><div class="card"><h3>${L("Design decisions","قرارات التصميم")}</h3><p style="color:var(--tx2)">${L("Bold type, generous white space, one strong accent color.","خط بارز ومساحات بيضاء واسعة ولون مميز واحد.")}</p></div><div class="card"><h3>${L("Outcome","النتيجة")}</h3><p style="color:var(--tx2)">${L("None reported: this is a concept, not client work.","لا توجد نتائج: هذا تصميم تصوري وليس عمل عميل.")}</p></div></div></div>`}}
else if(m2&&SV.find(s=>s.id==m2[1])){k="/services";html=P["/services"]()}
if(!html)html=P[k]?P[k](q):`<div class="wrap sec"><h1>404</h1><p class="sub">${L("This page doesn’t exist.","هذه الصفحة غير موجودة.")}</p><a class="btn" href="#/">${L("Back home","العودة للرئيسية")}</a></div>`;
document.documentElement.lang=lang;document.documentElement.dir=lang=="ar"?"rtl":"ltr";
const nm=(NAV.find(n=>n[0]==k)||[0,"Not found","غير موجود"]);document.title=`${L(nm[1],nm[2])} | RAEG | رائج`;
document.querySelector('meta[name=description]').content=L("RAEG is a creative digital agency for websites, social media and company profiles.","رائج وكالة رقمية إبداعية للمواقع وإدارة التواصل الاجتماعي وبروفايلات الشركات.");
document.getElementById("app").innerHTML=html;
document.getElementById("lk").innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${n[0]==k?"on":""}">${L(n[1],n[2])}</a>`).join("")+`<button class="lang" id="lb" aria-label="${L("Switch to Arabic","التبديل إلى الإنجليزية")}">${lang=="ar"?"EN":"AR"}</button><a class="btn" href="#/contact" style="color:#fff;margin-inline-start:6px">${L("Start a Project","ابدأ مشروعك")}</a>`;
document.getElementById("bg").setAttribute("aria-label",L("Menu","القائمة"));
document.getElementById("ft").innerHTML=`<div><div class="logo"><img src="${LOGO}" alt="" width="46" height="44">RAEG <small>رائج</small></div><p style="color:var(--tx2)">${L("We make your brand stand out.","نخلي علامتك تبرز.")}</p></div><div>${NAV.map(n=>`<a href="#${n[0]}">${L(n[1],n[2])}</a>`).join("")}</div><div><a href="https://wa.me/${CFG.whatsapp}" rel="noopener" target="_blank" dir="ltr">WhatsApp +966 54 254 5449</a><a href="mailto:${CFG.email}">${CFG.email}</a><small style="color:var(--tx2)">© RAEG</small></div>`;
document.getElementById("lk").classList.remove("open");document.getElementById("bg").setAttribute("aria-expanded","false");
document.getElementById("lb").onclick=()=>{lang=lang=="ar"?"en":"ar";try{localStorage.setItem("lang",lang)}catch(e){}route()};
window.scrollTo(0,0);bind()}
function bind(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1});document.querySelectorAll(".rv").forEach(e=>io.observe(e));
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("on",x==b));document.querySelectorAll("#pg>a").forEach(a=>a.style.display=b.dataset.f=="all"||a.dataset.c==b.dataset.f?"":"none")});
const fm=document.getElementById("fm");if(fm){let busy=0;fm.onsubmit=async e=>{e.preventDefault();if(busy)return;const st=document.getElementById("st");let bad=0;
const chk=(id,eid,ok,m)=>{document.getElementById("e-"+eid).textContent=ok?"":m;if(!ok)bad++};
const v=id=>fm.elements[id].value.trim();
chk("name","name",v("name"),L("Please enter your name.","فضلاً أدخل اسمك."));chk("email","email",/^\S+@\S+\.\S+$/.test(v("email")),L("Please enter a valid email.","فضلاً أدخل بريدًا إلكترونيًا صحيحًا."));chk("service","service",v("service"),L("Please choose a service.","فضلاً اختر الخدمة."));chk("message","msg",v("message").length>=10,L("Please describe your project (10+ characters).","فضلاً صف مشروعك (١٠ أحرف على الأقل)."));
if(bad)return;
if(!CFG.endpoint){st.innerHTML=`<div class="msg bad">${L("Sorry, this form isn’t connected to a submission service yet, so your inquiry was not sent. Please email us directly.","عذرًا، النموذج غير مربوط بخدمة استقبال بعد، لذلك لم يُرسل طلبك. فضلاً راسلنا مباشرة عبر البريد.")}</div>`;return}
busy=1;const b=document.getElementById("sb");b.disabled=true;b.textContent=L("Sending…","جارٍ الإرسال…");
try{const r=await fetch(CFG.endpoint,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(fm)))});if(!r.ok)throw 0;st.innerHTML=`<div class="msg ok">${L("Thank you! We received your inquiry.","شكرًا لك! وصلنا طلبك.")}</div>`;fm.reset();b.textContent=L("Sent","تم الإرسال")}
catch(x){busy=0;b.disabled=false;b.textContent=L("Send Inquiry","أرسل الطلب");st.innerHTML=`<div class="msg bad">${L("Something went wrong and your inquiry was not sent. Please try again or email us.","حدث خطأ ولم يُرسل طلبك. حاول مرة أخرى أو راسلنا بالبريد.")}</div>`}}}}
document.getElementById("bg").onclick=function(){const o=document.getElementById("lk").classList.toggle("open");this.setAttribute("aria-expanded",o)};
addEventListener("hashchange",route);route();
</script></body></html>
